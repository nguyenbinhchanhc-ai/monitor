name: SystemMonitor
options:
  bundleIdPrefix: com.systemmonitor
targets:
  SystemMonitor:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: SystemMonitor
    settings:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: 5.0
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UIBackgroundModes: "location"
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "SystemMonitor cần vị trí để duy trì hoạt động nền và giám sát hệ thống liên tục."
      INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Cho phép truy cập vị trí luôn luôn để app giám sát RAM/CPU và tự động dọn dẹp khi chạy ngầm."
